name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/secure-asterisk-news]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Tests, accessibility and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm audit --audit-level=moderate
  source-security:
    name: Redacted secrets and local SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Gitleaks with checksum verification
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' '/tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the checked-out tree without publishing secrets
        run: /tmp/gitleaks dir --redact=100 --no-banner --timeout=120 .
      - name: Install pinned offline-rule scanner
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install semgrep==1.185.0
      - name: Test local rules and scan source
        run: |
          /tmp/semgrep-venv/bin/semgrep scan --test --metrics=off --disable-version-check security
          /tmp/semgrep-venv/bin/semgrep scan --config security/review-rules.yaml --metrics=off --disable-version-check --oss-only --strict --error src server api
